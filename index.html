<!DOCTYPE html>
<html>
  <head>
    <title>My Snooker Tournaments</title>
    <style>
      /* --- Basic page styling --- */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex; /* for left menu + main content */
      }

      /* --- Top banner --- */
      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background-color: #2c3e50;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        z-index: 1000;
      }

      /* --- Left-side menu --- */
      #sidebar {
        width: 200px;
        background-color: #ecf0f1;
        padding: 10px;
        margin-top: 80px; /* leave space for header */
        height: 100vh;
        box-sizing: border-box;
      }

      #menuContent {
        display: none; /* hidden by default */
        margin-top: 10px;
      }

      #menuContent a {
        display: block;
        margin: 5px 0;
        text-decoration: none;
        color: #2c3e50;
      }

      /* --- Main content --- */
      #main {
        flex: 1;
        padding: 100px 20px 20px 20px; /* top padding leaves space for header */
      }

      /* --- Button styling --- */
      button {
        padding: 8px 12px;
        margin-bottom: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Top Banner -->
    <header>
      My Snooker Tournaments
    </header>

    <!-- Left Menu -->
    <div id="sidebar">
      <button onclick="toggleMenu()">Tournament Menu</button>
      <div id="menuContent">
        <a href="#">January Tournament</a>
        <a href="#">February Tournament</a>
        <a href="#">March Tournament</a>
      </div>
    </div>

    <!-- Main Content -->
    <div id="main">
      <h1>Welcome to My Snooker Tournaments</h1>
      <p>Monthly snooker tournaments hosted by me.</p>
      <a href="results.html">View past tournament results</a>
      <p>Next tournament: March 12, 7pm</p>
      <a href="EB 6red December Tournament.pdf" target="_blank">
        View Tournament Rules (PDF)
      </a>
    </div>

    <!-- JavaScript for menu toggle -->
    <script>
      function toggleMenu() {
        const menu = document.getElementById("menuContent");
        menu.style.display = menu.style.display === "none" ? "block" : "none";
      }
    </script>

  </body>
</html>
