<!DOCTYPE html>
<html>
<head>
  <title>Snooker Tournament Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }
    h1 {
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    input, button {
      margin: 10px 0;
      padding: 8px;
      font-size: 16px;
    }
    #successMessage {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      padding: 10px;
      margin-bottom: 15px;
      display: none; /* hidden by default */
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Register for a Tournament</h1>

  <div id="successMessage">Registration submitted successfully!</div>

  <form action="https://formsubmit.co/39966f029b1772133626474b6db96d25" method="POST">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    
    <!-- Redirect back to this page with success=true -->
    <input type="hidden" name="_next" value="https://kevinkuei-1226.github.io/EB_Snooker_Tournaments/register.html?success=true">
    
    <!-- Disable captcha -->
    <input type="hidden" name="_captcha" value="false">
    
    <button type="submit">Submit Registration</button>
  </form>

  <script>
    // Check if the URL has ?success=true
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('success') === 'true'){
      document.getElementById('successMessage').style.display = 'block';
    }
  </script>
</body>
</html>
